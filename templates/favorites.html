<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Τα Αγαπημένα Μου Παιχνίδια</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-dark text-white">


    <header>
        <h1>⭐ Τα Αγαπημένα Μου</h1>
        <a href="/" class="back-link" >⬅ Επιστροφή στην Αρχική</a>
    </header>

    <main>
        <div class="games-grid">
            {% for fav in favorite_games %}
                <div class="game-card">
                    <img src="{{ fav.image if fav.image else 'https://placeholder.com' }}" alt="{{ fav.name }}" class="game-img">
                    
                    <div class="game-info">
                        <h3>{{ fav.name }}</h3>
                        
                        <div class="fav-card-actions">
                            <!-- Σύνδεσμος για τις λεπτομέρειες από το API -->
                            <a href="{{ url_for('main.game_details', game_id=fav.rawg_id) }}" class="btn-fav-details">Λεπτομέρειες</a>
                            
                            <!-- Κουμπί για Διαγραφή (Delete) από τη βάση δεδομένων -->
                            <form action="{{ url_for('main.delete_favorite', fav_id=fav.id) }}" method="POST" class="fav-delete-form">
                                <button type="submit" class="btn-fav-delete">Διαγραφή</button>
                            </form>
                        </div>
                    </div>
                </div>
            {% else %}
                <p class="no-results">Δεν έχετε προσθέσει ακόμα αγαπημένα παιχνίδια!</p>
            {% endfor %}
        </div>
    </main>

</body>
</html>
