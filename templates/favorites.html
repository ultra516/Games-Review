<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Τα Αγαπημένα Μου Παιχνίδια</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <h1>⭐ Τα Αγαπημένα Μου</h1>
        <a href="/" class="back-link" style="color: #00ff88; text-decoration: none; font-weight: bold;">⬅ Επιστροφή στην Αρχική</a>
    </header>

    <main>
        <div class="games-grid">
            {% for fav in favorite_games %}
                <div class="game-card">
                    <img src="{{ fav.image if fav.image else 'https://placeholder.com' }}" alt="{{ fav.name }}" class="game-img">
                    
                    <div class="game-info">
                        <h3>{{ fav.name }}</h3>
                        
                        <div style="display: flex; gap: 10px; margin-top: 15px;">
                            <!-- Σύνδεσμος για τις λεπτομέρειες από το API -->
                            <a href="/game/{{ fav.rawg_id }}" class="details-btn" style="flex: 1; text-align: center; color: #00ff88; text-decoration: none; font-weight: bold;">Λεπτομέρειες</a>
                            
                            <!-- Κουμπί για Διαγραφή (Delete) από τη βάση δεδομένων -->
                            <form action="/favorite/delete/{{ fav.id }}" method="POST" style="flex: 1;">
                                <button type="submit" style="width: 100%; background-color: #ff3333; color: white; border: none; padding: 6px; border-radius: 6px; font-weight: bold; cursor: pointer;">
                                    Διαγραφή
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            {% else %}
                <p class="no-results">Δεν έχετε προσθέσει ακόμα αγαπημένα παιχνίδια!</p>
            {% endfor %}
        </div>
    </main>

</body>
</html>
