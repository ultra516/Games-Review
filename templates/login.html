<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Σύνδεση Χρήστη</title>
    <link rel="stylesheet" href="https://jsdelivr.net">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body bg-dark text-white">
    <!-- 📦 ΚΕΝΤΡΙΚΟ ΚΟΥΤΙ ΣΥΝΔΕΣΗΣ -->
    <div class="auth-container">
        <h2>Σύνδεση</h2>
        
        <form action="{{ url_for('main.login') }}" method="POST">
            <input type="email" name="email" class="auth-input" placeholder="Email" required>
            <input type="password" name="password" class="auth-input" placeholder="Κωδικός Πρόσβασης" required>
            <button type="submit" class="btn-auth-submit">Είσοδος</button>
        </form>
        
        <div class="auth-link-box">
            Δεν έχετε λογαριασμό; <a href="{{ url_for('main.register') }}">Εγγραφείτε εδώ</a>
        </div>
    </div>
</body>
</html>
