<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ανάκτηση Κωδικού</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body bg-dark text-white">
    <!-- ΚΕΝΤΡΙΚΟ ΚΟΥΤΙ ΑΝΑΚΤΗΣΗΣ -->
    <div class="auth-container">
        <h2>Ανάκτηση Κωδικού</h2>
        <p class="release-date">
            Εισάγετε το email σας και θα σας αποσταλεί ένας σύνδεσμος για να ορίσετε νέο κωδικό.
        </p>
        
        <form action="{{ url_for('main.forgot_password') }}" method="POST">
            <input type="email" name="email" class="auth-input" placeholder="Το Email σας" required>
            <button type="submit" class="btn-auth-submit">Αποστολή Συνδέσμου </button>
        </form>
        
        <div class="auth-link-box">
            <a href="{{ url_for('main.login') }}">⬅ Επιστροφή στη Σύνδεση</a>
        </div>
    </div>
</body>
</html>
