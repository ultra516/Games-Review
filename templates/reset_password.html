<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Νέος Κωδικός</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body bg-dark text-white">
    <!-- ΚΕΝΤΡΙΚΟ ΚΟΥΤΙ ΝΕΟΥ ΚΩΔΙΚΟΥ -->
    <div class="auth-container">
        <h2>Νέος Κωδικός</h2>
        <p class="release-date">
            Πληκτρολογήστε τον καινούργιο κωδικό πρόσβασης για τον λογαριασμό σας.
        </p>
        
        <form action="{{ url_for('main.reset_password', token=token) }}" method="POST">
            <input type="password" name="password" class="auth-input" placeholder="Νέος Κωδικός Πρόσβασης" autocomplete="new-password" required>
            <button type="submit" class="btn-auth-submit">Αποθήκευση Κωδικού </button>
        </form>
    </div>
</body>
</html>
